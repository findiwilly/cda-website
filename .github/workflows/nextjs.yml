# Continuous integration for the Cameroon Digital Agency site.
#
# This replaces the original GitHub Pages workflow, which could never have
# worked for this project: it uploaded `./out`, but `next.config.mjs` sets no
# `output: "export"`, so that directory does not exist. On top of that the site
# needs a server runtime — the admin panel, `/api/*` routes, MongoDB reads and
# SMTP notifications — which a static export cannot provide.
#
# Deployment to Vercel is handled by Vercel's own Git integration, not here. This
# workflow's job is to fail a pull request *before* that integration ever builds
# it. See `docs/a-fix-ci.md`.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Allow one concurrent run per ref but cancel superseded ones — a stale result on
# a closed PR is noise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Messages, content, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20: `scripts/*.ts` run directly through Node's type
          # stripping, which only exists from 22.6. On 20 the seed and the
          # content check both fail to parse.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check message files
        run: npm run messages

      # Pure data validation — no database, no credentials. Catches a French FAQ
      # with an English word in it, a translation pointing at a missing slug, or
      # a post body starting at `#` (which would render a second h1).
      - name: Check seed content
        run: npm run seed:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # A production build with no credentials must still succeed: every
          # database read degrades to an empty result rather than throwing, so a
          # PR from a fork (which has no access to secrets) exercises the same
          # code path as production without needing the real values.
          NEXT_PUBLIC_SITE_URL: https://example.com