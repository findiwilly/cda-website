<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- CDA favicon: green flag-gradient tile, geometric C monogram. -->
  <defs>
    <linearGradient id="cm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007A5E"/>
      <stop offset="100%" stop-color="#00A67E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0A0A0B"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#cm)"/>
  <!-- C monogram, drawn as a ring with a flag-yellow aperture -->
  <path d="M44 22.5a18 18 0 1 0 0 19v-9.4a9.6 9.6 0 1 1 0-10.2z" fill="#F2F2F5"/>
  <!-- Red accent notch: a single emphatic stroke, per brand rules -->
  <rect x="38" y="30.2" width="8" height="3.6" rx="1.8" fill="#CE1126"/>
</svg>
